name: Compliance Tests

on:
  pull_request:
    paths:
      - reso-reference-server/**
      - certification/**
      - odata-client/**
      - odata-expression-parser/**
      - validation/**
      - data-generator/**
  push:
    branches: [main]
  workflow_dispatch:

env:
  SEED_COUNTS: Property=1000,Media=5,OpenHouse=2,Showing=2,PropertyRooms=3,PropertyGreenVerification=1,PropertyPowerProduction=1,PropertyUnitTypes=2

jobs:
  compliance-postgres:
    name: Compliance (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start (PostgreSQL)
        working-directory: reso-reference-server
        run: docker compose up -d --build --wait

      - name: Data Dictionary 2.0 compliance
        working-directory: reso-reference-server
        run: docker compose --profile compliance-dd up --build --exit-code-from compliance-dd

      - name: Web API Core 2.0.0 compliance
        working-directory: reso-reference-server
        run: docker compose --profile compliance-core up --build --exit-code-from compliance-core

      - name: Add/Edit RCP-010 compliance
        working-directory: reso-reference-server
        run: docker compose --profile compliance-addedit up --build --exit-code-from compliance-addedit

      - name: EntityEvent RCP-027 compliance
        working-directory: reso-reference-server
        run: docker compose --profile compliance-entity-event up --build --exit-code-from compliance-entity-event

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-results-postgres
          path: reso-reference-server/compliance/results/

  compliance-mongodb:
    name: Compliance (MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start (MongoDB)
        working-directory: reso-reference-server
        run: docker compose --profile mongodb up -d --build --wait

      - name: Data Dictionary 2.0 compliance (MongoDB)
        working-directory: reso-reference-server
        run: docker compose --profile mongodb --profile compliance-dd-mongo up --build --exit-code-from compliance-dd-mongo

      - name: Web API Core 2.0.0 compliance (MongoDB)
        working-directory: reso-reference-server
        run: docker compose --profile mongodb --profile compliance-core-mongo up --build --exit-code-from compliance-core-mongo

      - name: Add/Edit RCP-010 compliance (MongoDB)
        working-directory: reso-reference-server
        run: docker compose --profile compliance-addedit-mongo up --build --exit-code-from compliance-addedit-mongo

      - name: EntityEvent RCP-027 compliance (MongoDB)
        working-directory: reso-reference-server
        run: docker compose --profile mongodb --profile compliance-entity-event-mongo up --build --exit-code-from compliance-entity-event-mongo

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-results-mongodb
          path: reso-reference-server/compliance/results/

  compliance-sqlite:
    name: Compliance (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start (SQLite)
        working-directory: reso-reference-server
        run: docker compose --profile sqlite up -d --build --wait server-sqlite

      - name: Data Dictionary 2.0 compliance (SQLite)
        working-directory: reso-reference-server
        run: docker compose --profile sqlite --profile compliance-dd-sqlite up --build --exit-code-from compliance-dd-sqlite

      - name: Web API Core 2.0.0 compliance (SQLite)
        working-directory: reso-reference-server
        run: docker compose --profile sqlite --profile compliance-core-sqlite up --build --exit-code-from compliance-core-sqlite

      - name: EntityEvent RCP-027 compliance (SQLite)
        working-directory: reso-reference-server
        run: docker compose --profile compliance-entity-event-sqlite up --build --exit-code-from compliance-entity-event-sqlite

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-results-sqlite
          path: reso-reference-server/compliance/results/
