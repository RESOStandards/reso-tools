# CodeQL advanced setup.
#
# Based on GitHub's advanced-setup template, with `v1.0.0-pre` added to the push
# and pull_request branch lists — the effective mainline until v1.0.0, which
# default setup (main-only) never scanned. Uncomment `queries: security-extended`
# below for a broader security pack.
name: "CodeQL Advanced"

on:
  push:
    branches: ["main", "v1.0.0-pre"]
  pull_request:
    branches: ["main", "v1.0.0-pre"]
  schedule:
    - cron: "42 14 * * 2"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # queries: security-extended   # uncomment for the broader security-query pack

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
