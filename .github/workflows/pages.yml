name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Sync package READMEs into site
        run: |
          # Copy each package README as a Jekyll collection page
          packages=(
            "validation:@reso-standards/validation:Isomorphic validation library"
            "odata-expression-parser:@reso-standards/odata-expression-parser:OData filter parser"
            "reso-client:@reso-standards/reso-client:RESO Client SDK"
            "data-generator:@reso-standards/data-generator:Test data generator"
            "certification:@reso-standards/certification:Certification testing tools"
            "reso-reference-server:reso-reference-server:OData reference server"
            "reso-web-client:@reso/web-client:React browser UI"
            "reso-desktop-client:@reso/desktop-client:Electron desktop shell"
          )

          mkdir -p .github/pages/_packages
          for entry in "${packages[@]}"; do
            IFS=':' read -r dir name desc <<< "$entry"

            # Find the README — handle nested structures
            if [ -f "$dir/README.md" ]; then
              readme="$dir/README.md"
            elif [ -f "$dir/server/README.md" ]; then
              readme="$dir/server/README.md"
            else
              continue
            fi

            # Create Jekyll front matter + README content
            cat > ".github/pages/_packages/$dir.md" <<FRONT
          ---
          title: "$name"
          package_name: "$name"
          description: "$desc"
          layout: package
          ---

          FRONT
            cat "$readme" >> ".github/pages/_packages/$dir.md"
          done

      - name: Sync project docs into site
        run: |
          docs=(
            "RELEASES.md:Release Notes:releases"
            "ANNOUNCEMENTS.md:Announcements:announcements"
            "SECURITY_AUDIT.md:Security Audit:security"
          )
          for entry in "${docs[@]}"; do
            IFS=':' read -r file title slug <<< "$entry"
            if [ -f "$file" ]; then
              cat > ".github/pages/${slug}.md" <<FRONT
          ---
          title: "${title}"
          layout: default
          permalink: /${slug}/
          ---

          FRONT
              cat "$file" >> ".github/pages/${slug}.md"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.github/pages
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
