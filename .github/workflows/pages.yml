name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Sync package READMEs into site
        run: |
          # Copy each package README as a Jekyll collection page.
          #
          # The set of pages is *discovered*, not enumerated. For each
          # known package we walk its directory tree, find every
          # README.md that isn't excluded by the skip patterns below,
          # and render it as a page under tools.reso.org.
          #
          # URL scheme:
          #   <pkg>/README.md                  → /packages/<pkg>/
          #   <pkg>/<a>/README.md              → /packages/<pkg>/<a>/
          #   <pkg>/src/<a>/README.md          → /packages/<pkg>/<a>/
          #     (the literal "src/" segment is stripped — it's a build
          #      convention, not a meaningful URL component)
          #   <pkg>/<a>/<b>/README.md          → /packages/<pkg>/<a>/<b>/
          #
          # Title for each page is the first H1 (`# Title`) in the
          # README. If no H1 is found we fall back to a title-cased
          # version of the leaf directory name.
          #
          # Skip patterns (any of these in the path → skip):
          #   legacy-cert-utils/, node_modules/, dist/, build/, .next/,
          #   _site/, tests/, test/, __tests__/, .github/, .vscode/,
          #   coverage/, sample-payloads/, sample-configs/, examples/
          #
          # During the copy we sed-rewrite README links so they resolve
          # correctly under tools.reso.org without requiring authors to
          # use a special URL convention. The rewrites:
          #
          #   - src/<sub>/README.md → <sub>/        (relative to package
          #                                          page; resolves to the
          #                                          discovered sub-page)
          #   - <sub>/README.md     → <sub>/        (same, no src/ prefix)
          #   - examples/<path>     → absolute GitHub URL (code files;
          #                                          GitHub renders them
          #                                          better than we can)
          #   - doc/<file>.md       → absolute GitHub URL (revisited when
          #                                          the User Guides
          #                                          project lands)
          #
          # Source READMEs are never modified — the rewrite happens on
          # the copy in .github/pages/_packages/.

          packages=(
            "reso-validation:@reso-standards/reso-validation:Isomorphic validation library"
            "odata-expression-parser:@reso-standards/odata-expression-parser:OData filter parser"
            "reso-client:@reso-standards/reso-client:RESO Client SDK"
            "reso-data-generator:@reso-standards/reso-data-generator:Test data generator"
            "reso-certification:@reso-standards/reso-certification:Certification testing tools"
            "reso-reference-server:@reso-standards/reso-reference-server:OData reference server"
            "reso-web-client:@reso-standards/reso-web-client:React browser UI"
            "reso-desktop-client:@reso-standards/reso-desktop-client:Electron desktop shell"
            "reso-web-api-proxy:@reso-standards/reso-web-api-proxy:CORS proxy server"
            "reso-mcp-server:@reso-standards/reso-mcp-server:MCP server for AI agents"
          )

          GH_BLOB="https://github.com/RESOStandards/reso-tools/blob/main"
          GH_TREE="https://github.com/RESOStandards/reso-tools/tree/main"

          # Path-segment patterns to exclude. A README is skipped if
          # *any* segment in its path matches one of these.
          SKIP_SEGMENTS="legacy-cert-utils node_modules dist build .next _site tests test __tests__ .github .vscode coverage sample-payloads sample-configs examples"

          # Returns 0 if any segment of the given path matches a skip
          # pattern, 1 otherwise.
          should_skip() {
            local path="$1"
            local seg
            for seg in $SKIP_SEGMENTS; do
              case "/$path/" in
                */$seg/*) return 0 ;;
              esac
            done
            return 1
          }

          # Extract the first H1 from a README; print to stdout. Falls
          # back to a title-cased version of the directory name.
          extract_title() {
            local readme="$1"
            local fallback="$2"
            local h1
            h1=$(grep -m 1 -E '^#[[:space:]]+' "$readme" | sed -E 's/^#[[:space:]]+//' | sed -E 's/[[:space:]]+$//')
            if [ -n "$h1" ]; then
              printf '%s\n' "$h1"
            else
              printf '%s\n' "$fallback"
            fi
          }

          # Title-case a kebab-case directory name as a fallback title:
          # "add-edit" → "Add Edit"
          titlecase() {
            printf '%s\n' "$1" | sed -E 's/[-_]/ /g' | awk '{
              for (i=1; i<=NF; i++) $i = toupper(substr($i,1,1)) substr($i,2);
              print
            }'
          }

          # Apply the README link rewrites for a given package directory.
          # Reads stdin, writes stdout.
          rewrite_links() {
            local pkg_dir="$1"
            sed -E \
              -e "s|\]\(src/([a-z0-9_/-]+)/README\.md\)|\](\1/)|g" \
              -e "s|\]\(([a-z0-9][a-z0-9_/-]*)/README\.md\)|\](\1/)|g" \
              -e "s|\]\(examples/([^)]+)\)|\](${GH_BLOB}/${pkg_dir}/examples/\1)|g" \
              -e "s|\]\(examples/\)|\](${GH_TREE}/${pkg_dir}/examples)|g" \
              -e "s|\]\(doc/([^)]+)\)|\](${GH_BLOB}/${pkg_dir}/doc/\1)|g"
          }

          # Translate a path-relative-to-package into the URL segment
          # under /packages/<pkg>/. Strips a leading "src/" if present.
          # Returns the empty string for the package root.
          to_url_segment() {
            local rel="$1"          # e.g. "src/add-edit" or "lib/oauth" or ""
            [ -z "$rel" ] && { printf '\n'; return; }
            case "$rel" in
              src) printf '\n'; return ;;
              src/*) printf '%s\n' "${rel#src/}"; return ;;
            esac
            printf '%s\n' "$rel"
          }

          mkdir -p .github/pages/_packages

          discovered_count=0
          skipped_count=0

          for entry in "${packages[@]}"; do
            IFS=':' read -r pkg_dir pkg_name pkg_desc <<< "$entry"
            [ -d "$pkg_dir" ] || { echo "skip missing package: $pkg_dir" >&2; continue; }

            # Find every README.md in the package, prune skip dirs.
            #
            # We use `find -prune` to avoid descending into excluded
            # directories at all (faster, and avoids edge cases where a
            # nested allowed dir lives under an excluded parent).
            prune_args=()
            for seg in $SKIP_SEGMENTS; do
              prune_args+=( -name "$seg" -prune -o )
            done

            while IFS= read -r readme; do
              # Path relative to the package dir. For the package
              # README this is empty.
              rel_dir=$(dirname "${readme#$pkg_dir/}")
              [ "$rel_dir" = "." ] && rel_dir=""

              # Extra defense — should_skip catches anything find missed
              if [ -n "$rel_dir" ] && should_skip "$rel_dir"; then
                skipped_count=$((skipped_count + 1))
                continue
              fi

              url_seg=$(to_url_segment "$rel_dir")

              if [ -z "$url_seg" ]; then
                # Top-level package README → /packages/<pkg>/
                out_file=".github/pages/_packages/${pkg_dir}.md"
                permalink="/packages/${pkg_dir}/"
                title="$pkg_name"
                description="$pkg_desc"
                parent_front=""
              else
                # Nested README → /packages/<pkg>/<url_seg>/
                # File on disk uses double-dash as path separator so
                # the collection stays flat.
                flat_seg=$(printf '%s\n' "$url_seg" | tr '/' '-')
                out_file=".github/pages/_packages/${pkg_dir}--${flat_seg}.md"
                permalink="/packages/${pkg_dir}/${url_seg}/"

                # Title from H1, fallback to title-cased leaf dir.
                leaf=$(basename "$rel_dir")
                fallback_title=$(titlecase "$leaf")
                title=$(extract_title "$readme" "$fallback_title")

                description="Part of ${pkg_name}"
                parent_front="parent_package: \"${pkg_dir}\"
          parent_package_name: \"${pkg_name}\"
          parent_package_url: \"/packages/${pkg_dir}/\""
              fi

              {
                echo "---"
                echo "title: \"${title}\""
                echo "package_name: \"${title}\""
                echo "description: \"${description}\""
                echo "layout: package"
                echo "permalink: \"${permalink}\""
                if [ -n "$parent_front" ]; then
                  echo "$parent_front"
                fi
                echo "---"
                echo
              } > "$out_file"

              rewrite_links "$pkg_dir" < "$readme" >> "$out_file"

              echo "  → ${permalink}  (from ${readme})"
              discovered_count=$((discovered_count + 1))
            done < <(find "$pkg_dir" "${prune_args[@]}" -name 'README.md' -print)
          done

          echo
          echo "Discovered ${discovered_count} README pages (${skipped_count} extra skips)."

      - name: Sync user guides into site
        run: |
          # Discover and publish user guides. Each package may have a
          # doc/GUIDE.md (matching the existing reso-mcp-server pattern).
          # Discovery is data-driven so new guides appear on the site
          # automatically when their GUIDE.md is committed — no workflow
          # changes needed.
          #
          # URL: /guides/<package>/
          # Layout: guide (cousin of package, with breadcrumb back to /guides/)
          # Title: extracted from the first H1 in the guide
          #
          # Link rewrites are the same family as the package README pass:
          # examples/* and src/* references go to GitHub blob/tree URLs;
          # sibling-package references like ../reso-validation/ continue to
          # work because tools.reso.org already has /packages/<name>/.

          packages=(
            "reso-validation:@reso-standards/reso-validation"
            "odata-expression-parser:@reso-standards/odata-expression-parser"
            "reso-client:@reso-standards/reso-client"
            "reso-data-generator:@reso-standards/reso-data-generator"
            "reso-certification:@reso-standards/reso-certification"
            "reso-reference-server:@reso-standards/reso-reference-server"
            "reso-web-client:@reso-standards/reso-web-client"
            "reso-desktop-client:@reso-standards/reso-desktop-client"
            "reso-web-api-proxy:@reso-standards/reso-web-api-proxy"
            "reso-mcp-server:@reso-standards/reso-mcp-server"
          )

          GH_BLOB="https://github.com/RESOStandards/reso-tools/blob/main"
          GH_TREE="https://github.com/RESOStandards/reso-tools/tree/main"

          extract_title() {
            local f="$1"
            local fallback="$2"
            local h1
            h1=$(grep -m 1 -E '^#[[:space:]]+' "$f" | sed -E 's/^#[[:space:]]+//' | sed -E 's/[[:space:]]+$//')
            if [ -n "$h1" ]; then
              printf '%s\n' "$h1"
            else
              printf '%s\n' "$fallback"
            fi
          }

          rewrite_guide_links() {
            local pkg_dir="$1"
            sed -E \
              -e "s|\]\(\.\./reso-([a-z0-9-]+)/\)|\](/packages/reso-\1/)|g" \
              -e "s|\]\(\.\./odata-expression-parser/\)|\](/packages/odata-expression-parser/)|g" \
              -e "s|\]\(\.\./\)|\](${GH_TREE}/${pkg_dir})|g" \
              -e "s|\]\(examples/([^)]+)\)|\](${GH_BLOB}/${pkg_dir}/examples/\1)|g" \
              -e "s|\]\(examples/\)|\](${GH_TREE}/${pkg_dir}/examples)|g" \
              -e "s|\]\(src/([^)]+)\)|\](${GH_BLOB}/${pkg_dir}/src/\1)|g"
          }

          mkdir -p .github/pages/_guides
          guide_count=0

          for entry in "${packages[@]}"; do
            IFS=':' read -r pkg_dir pkg_name <<< "$entry"
            guide="${pkg_dir}/doc/GUIDE.md"
            [ -f "$guide" ] || continue

            title=$(extract_title "$guide" "$pkg_name")
            out_file=".github/pages/_guides/${pkg_dir}.md"

            cat > "$out_file" <<FRONT
          ---
          title: "${title}"
          package: "${pkg_name}"
          package_url: "/packages/${pkg_dir}/"
          layout: guide
          permalink: "/guides/${pkg_dir}/"
          ---

          FRONT
            rewrite_guide_links "$pkg_dir" < "$guide" >> "$out_file"

            echo "  → /guides/${pkg_dir}/  (from ${guide})"
            guide_count=$((guide_count + 1))
          done

          echo
          echo "Discovered ${guide_count} user guides."

      - name: Sync project docs into site
        run: |
          docs=(
            "RELEASES.md:Release Notes:releases"
            "ANNOUNCEMENTS.md:Announcements:announcements"
            "SECURITY_AUDIT.md:Security Audit:security"
          )
          for entry in "${docs[@]}"; do
            IFS=':' read -r file title slug <<< "$entry"
            if [ -f "$file" ]; then
              cat > ".github/pages/${slug}.md" <<FRONT
          ---
          title: "${title}"
          layout: doc
          permalink: /${slug}/
          ---

          FRONT
              cat "$file" >> ".github/pages/${slug}.md"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.github/pages
          destination: ./_site

      - name: Build search index with Pagefind
        run: |
          cp -r ./_site ./_site_searchable
          npx pagefind --site ./_site_searchable

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site_searchable

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
