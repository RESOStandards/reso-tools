name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build shared libraries
        run: |
          npm install
          cd reso-validation && npm install && npx tsc && cd ..
          cd odata-expression-parser && npm install && npx tsc && cd ..
          cd reso-client && npm install && npx tsc && cd ..
          cd reso-data-generator && npm install && npx tsc && cd ..
          cd reso-reference-server && npm install && npm run build && cd ..
          cd reso-web-api-proxy && npm install && npm run build && cd ..
          cd reso-web-client && npm install && npm run build && cd ..

      - name: Build reso-certification (for desktop client cert runner)
        run: |
          cd reso-certification && npm pkg delete dependencies.@reso/reso-certification-utils && npm install && npx tsc && cd ..

      - name: Install desktop client dependencies
        run: cd reso-desktop-client && npm install

      - name: Build desktop client
        run: cd reso-desktop-client && npm run build && npm run build:server-bundle

      - name: Package Electron app
        run: cd reso-desktop-client && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            reso-desktop-client/dist/*.dmg
            reso-desktop-client/dist/*.zip
            reso-desktop-client/dist/*.AppImage
            reso-desktop-client/dist/*.deb
            reso-desktop-client/dist/*.exe
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # If the release already exists (typical: published manually as a draft),
          # upload the binaries to it. Otherwise create it from scratch.
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" artifacts/* \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --generate-notes
          fi
