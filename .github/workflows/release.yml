name: Build & Release

on:
  push:
    tags: ['v*']
    branches: [fix-packaging]  # temporary: test packaging on this branch
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure git and npm for CI
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          npm config set ignore-scripts true

      - name: Bootstrap all packages
        run: npm run bootstrap:force
        shell: bash

      - name: Package Electron app
        run: cd reso-desktop-client && npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            reso-desktop-client/dist/*.dmg
            reso-desktop-client/dist/*.zip
            reso-desktop-client/dist/*.AppImage
            reso-desktop-client/dist/*.deb
            reso-desktop-client/dist/*.exe
          if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/fix-packaging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tagged release — upload to existing or create new
            tag="${GITHUB_REF#refs/tags/}"
            if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "$tag" artifacts/* --repo "${{ github.repository }}" --clobber
            else
              gh release create "$tag" artifacts/* \
                --repo "${{ github.repository }}" \
                --title "$tag" \
                --generate-notes
            fi
          else
            # Branch build — create/update a draft pre-release for testing
            tag="packaging-test"
            # Delete previous test release if it exists
            gh release delete "$tag" --repo "${{ github.repository }}" --yes 2>/dev/null || true
            gh api repos/${{ github.repository }}/git/refs/tags/$tag -X DELETE 2>/dev/null || true
            gh release create "$tag" artifacts/* \
              --repo "${{ github.repository }}" \
              --title "Packaging Test (${GITHUB_SHA::7})" \
              --notes "Automated test build from \`fix-packaging\` branch at ${GITHUB_SHA::7}. **Not for distribution.**" \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
