# Docker Compose for the RESO Web Client
#
# Profiles:
#   proxy  — Web client + CORS proxy (connect to external OData servers)
#   full   — Web client + reference server + PostgreSQL (local test data + external)
#
# Usage:
#   docker compose --profile proxy up -d        # Proxy only (external servers)
#   docker compose --profile full up -d         # Full stack with reference server
#   docker compose --profile full,seed up seed  # Full stack + seed test data

services:
  # ── Proxy-only mode ─────────────────────────────────────────────────
  # Lightweight proxy server that serves the web UI and proxies external
  # OData requests. No local data — connect to external servers only.
  proxy:
    profiles: ["proxy"]
    build:
      context: ..
      dockerfile: reso-web-api-proxy/Dockerfile
    ports:
      - "8888:8888"
    restart: unless-stopped

  # ── Full mode (reference server + UI) ───────────────────────────────
  server:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: reso-reference-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://reso:reso@db:5432/reso_reference
      METADATA_PATH: ./server-metadata.json
      BASE_URL: http://server:8080
      ENUM_MODE: string
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  db:
    profiles: ["full"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reso
      POSTGRES_PASSWORD: reso
      POSTGRES_DB: reso_reference
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reso -d reso_reference"]
      interval: 5s
      timeout: 5s
      retries: 5

  ui:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: reso-web-client/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

  # Seed the database with test data (run once)
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: reso-reference-server/Dockerfile
    environment:
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://reso:reso@db:5432/reso_reference
      METADATA_PATH: ./server-metadata.json
    command: ["node", "dist/seed.js"]
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
