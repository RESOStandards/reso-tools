      # BASE_URL: http://server-entity-event:8080  # unset -> server derives base from request Host (see reso-reference-server base-url.ts); set only to pin a public URL a proxy/CDN hides
      ENUM_MODE: string
      ENTITY_EVENT: "true"
    depends_on:
