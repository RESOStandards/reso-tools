      DATABASE_URL: postgresql://reso:reso@db-addedit:5432/reso_addedit
      METADATA_PATH: ./server-metadata.json
      # BASE_URL: http://server-addedit:8080  # unset -> server derives base from request Host (see reso-reference-server base-url.ts); set only to pin a public URL a proxy/CDN hides
